      ${SCENES.map((s, i) => `<a href="${s.file}${keep()}" style="${i === idx ? 'color:#fff;font-weight:700' : ''}">${i + 1} ${s.name}</a>`).join(' · ')}<br>
      camera <b>${S.mode}</b>${S.mode === 'custom' && S.custom.length < 2 ? ' <span class="warn">(needs ≥ 2 keys, using script)</span>' : ''} · keys ${keys} · glitch ${ctx.glitch ? 'on' : 'off'}

      <div class="keys"><span class="k">Space</span> play · <span class="k">R</span> restart · <span class="k">←/→</span> ±1 s (<span class="k">Shift</span> ±0.1) · <span class="k">[ ]</span> speed · <span class="k">1–9</span> pick scene · <span class="k">N/B</span> next/prev<br>

/* ------------------------------------------------------------------ the radar's field (shared by decay, intercept) */
// A line grid like the dashboard's surface (web/app.js): cool lines, a glow, a sonar ring, entropy noise that the
// ring calms, and peaks (gaussians) that turn swarm-red. heightFn in GLSL so points can sit on it too.
const FIELD_GLSL = `${GLSL_HASH}
  uniform float uTime, uNoise, uRingT, uRingSpeed, uRingOn, uCalm;
  uniform vec2 uRingO;
  uniform vec4 uPeaks[8];          // xy = centre, z = height, w = width²
  uniform float uPeakKind[8];      // 0 organic (salat), 1 suspicious (yellow), 2 swarm (red)
  float fieldH(vec2 p, out float passed, out float ring, out float peak, out float nz){
    float d = length(p - uRingO), r = (uTime - uRingT)*uRingSpeed, on = uRingOn*step(0., uTime - uRingT);
    passed = max(uCalm, on * (1. - smoothstep(r - 1.2, r + .4, d)));
    float rr = (d - r)/.75;
    ring = on * exp(-rr*rr) * (1. - smoothstep(30., 40., r));
    float wave = .22*sin(p.x*.21 + uTime*.55)*cos(p.y*.27 - uTime*.42) + .12*sin(p.x*.07 - p.y*.11 + uTime*.3);
    nz = (h2(floor(p*2.2) + floor(uTime*14.)) - .5) * uNoise * (1. - passed);

    for (int i = 0; i < 8; i++) { vec2 q = p - uPeaks[i].xy; peak += uPeaks[i].z * exp(-dot(q, q)/max(.01, uPeaks[i].w)); }
    return wave + nz*1.6 + peak;
  }
  vec3 peakKinds(vec2 p){             // how much of each kind of hill is under p: (organic, suspicious, swarm)
    vec3 k = vec3(0.);
    for (int i = 0; i < 8; i++) { vec2 q = p - uPeaks[i].xy; float h = uPeaks[i].z * exp(-dot(q, q)/max(.01, uPeaks[i].w));
      k += h * vec3(step(uPeakKind[i], .5), step(.5, uPeakKind[i])*step(uPeakKind[i], 1.5), step(1.5, uPeakKind[i])); }
    return k;
  }`;
function makeField({W = 40, D = 24, NX = 150, NZ = 90, every = 3, thr = 1e3} = {}) {
  const pos = new Float32Array(NX * NZ * 3);
  for (let iz = 0; iz < NZ; iz++) for (let ix = 0; ix < NX; ix++) {
    const k = (iz * NX + ix) * 3; pos[k] = (ix / (NX - 1) - .5) * W; pos[k + 1] = 0; pos[k + 2] = (iz / (NZ - 1) - .5) * D;
  }
  const idx = [];
  for (let iz = 0; iz < NZ; iz++) for (let ix = 0; ix < NX - 1; ix++) idx.push(iz * NX + ix, iz * NX + ix + 1);
  for (let ix = 0; ix < NX; ix += every) for (let iz = 0; iz < NZ - 1; iz++) idx.push(iz * NX + ix, (iz + 1) * NX + ix);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(idx);
  const U = {
    uTime: {value: 0}, uA: {value: 1}, uNoise: {value: 0}, uCalm: {value: 0}, uRingT: {value: 1e3}, uRingSpeed: {value: 9}, uRingOn: {value: 1},
    uRingO: {value: new THREE.Vector2(0, 0)}, uPeaks: {value: Array.from({length: 8}, () => new THREE.Vector4(0, 0, 0, 1))}, uPeakKind: {value: new Array(8).fill(0)},
    uThr: {value: thr}, uRingRed: {value: 0},
    uCool: {value: new THREE.Color(PAL.cool)}, uCream: {value: new THREE.Color(PAL.cream)}, uRed: {value: new THREE.Color(PAL.swarm)}, uSel: {value: new THREE.Color(PAL.sel)},
    uSalat: {value: new THREE.Color(PAL.warm)}, uYel: {value: new THREE.Color(PAL.peak)}, uKindOn: {value: 0},
  };
  const mat = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `${FIELD_GLSL}
      varying float vPassed, vRing, vPeak, vNz, vEdge, vY; varying vec3 vKind;
      void main(){
        float passed, ring, peak, nz;
        vec3 p = position; p.y = fieldH(p.xz, passed, ring, peak, nz);
        vPassed = passed; vRing = ring; vPeak = peak; vNz = nz; vY = p.y; vKind = peakKinds(p.xz);
        vEdge = 1. - smoothstep(.40, .5, max(abs(position.x)/${W.toFixed(1)}, abs(position.z)/${D.toFixed(1)}));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
      }`,
    fragmentShader: `uniform float uA, uThr, uRingRed, uKindOn; uniform vec3 uCool, uCream, uRed, uSel, uSalat, uYel;
      varying float vPassed, vRing, vPeak, vNz, vEdge, vY; varying vec3 vKind;
      void main(){
        float flick = .45 + 1.6*abs(vNz);
        vec3 c = uCool * mix(flick, .55, vPassed);
        c *= 1. + clamp(vPeak*.35, 0., 1.4);                    // a rising hill glows
        // coloured hills (decay): organic salat, suspicious yellow, the swarm red, each by how much of it is here
        vec3 kc = uSalat*vKind.x + uYel*vKind.y + uRed*1.25*vKind.z; float kw = vKind.x + vKind.y + vKind.z;
        c = mix(c, kc/max(kw, 1e-3)*1.7, uKindOn*clamp(kw*.55, 0., 1.));
        c = mix(c, uSel*1.7, smoothstep(uThr - .25, uThr + .25, vY));   // above the CFAR threshold: the selected-group pink
        c += mix(uCream, uRed, uRingRed) * vRing * 1.35;
        gl_FragColor = vec4(c * uA * vEdge, 1.);
      }`,
  });
  const mesh = new THREE.LineSegments(geo, mat); mesh.frustumCulled = false;
  return {mesh, U, W, D, NX, NZ, pos};
}

// ---- social.js
// Social: ~5 s insert. A schematic phone (no real app's look or logo: grey placeholders, generic icons). The feed is

const LEN = qn('len', 5);
const PUSH = ['So true 🔥', 'Everyone needs to see this', '100% agree', 'Finally someone said it', 'Share this everywhere!',
  'This. Exactly this.', 'Can\'t believe nobody talks about this', 'Spread the word 🙌', 'Facts. Period.', 'Wake up people!!',
  'Absolutely right', 'Needs to go viral', 'Truth 💯', 'Saying it louder for the people in the back'];
const HUMAN = ['wait what is this about?', 'source?', 'why is my whole feed this post'];

const post = (i, cls = '') => `
  <div class="sp-post ${cls}">
    <div class="sp-ph"><i></i><b></b><s></s></div>
    <div class="sp-img sp-img${i}"><span class="sp-sun"></span><span class="sp-hill a"></span><span class="sp-hill b"></span></div>

    <div class="sp-likes">${cls ? '<b id="spLikes">1,204</b> likes' : '<b>3,118</b> likes'}</div>
    <div class="sp-cap"><b></b><s></s></div>
  </div>`;

const UI = `
<div class="sp">
  <div class="sp-phone">
    <div class="sp-notch"></div>
    <div class="sp-bar"><b></b><span>⌂ ⌕ ＋ ♡ ◉</span></div>
    <div class="sp-screen"><div class="sp-track" id="spTrack">${post(1)}${post(2)}${post(3)}${post(4, 'target')}</div>
      <div class="sp-hearts" id="spHearts"></div>
      <div class="sp-sheet" id="spSheet"><div class="sp-grab"></div><div class="sp-sh"><b>Comments</b><span id="spCN">0</span></div><ul id="spList"></ul></div>
    </div>
  </div>
  <div class="sp-count l"><div><b id="spBigL">1.2K</b><span>likes</span></div><small id="spRateL">+0 / min</small></div>
  <div class="sp-count r"><div><b id="spBigC">0</b><span>comments</span></div><small id="spRateC">+0 / min</small></div>
  <div class="sp-note">schematic · not a real app</div>
</div>`;

function run() {
  const DUR = LEN + .4;
  const ctx = createStage({id: 'social', title: 'Social', duration: DUR, ui: UI, bloom: {strength: .2, radius: .3, threshold: .7}, path: [{t: 0, p: [0, 0, 10], l: [0, 0, 0]}], frame, after});
  const {$} = ctx;
  const S = t => t / LEN * 5;                        // the story is timed for 5 s; ?len stretches it
  const SW = [.25, .6, .95], STOP = 1.2, SHEET = 2.0;
  const r = rng(21);
  const hearts = Array.from({length: 140}, (_, i) => ({t0: STOP + Math.pow(i / 140, .7) * 3.6, x: r() * 64 - 8, dur: .9 + r() * .5, s: .7 + r() * .8}));
  const comments = Array.from({length: 150}, (_, i) => {
    const human = r() < .06;
    return {x: SHEET + .15 + Math.pow(i / 150, .55) * 2.75, who: human ? humanHandle(i) : botHandle(i % 25), text: human ? HUMAN[i % HUMAN.length] : PUSH[Math.floor(r() * PUSH.length)], bot: !human};
  });
  const likesAt = s => s < STOP ? 1204 : Math.round(1204 + 47800 * Math.pow(clamp((s - STOP) / 3.6), 1.7));
  const cAt = s => s < SHEET ? 0 : Math.round(12400 * Math.pow(clamp((s - SHEET) / 2.9), 1.5));
  const k = n => n >= 1e4 ? `${(n / 1000).toFixed(1)}K` : n.toLocaleString('en-US');
  let lastC = '', lastH = '';

  function frame(t, c) { c.fade = 1 - ss(0, .2, t) + ss(DUR - .3, DUR, t); }
  function after(t) {
    const s = S(t);
    // swipes: each moves the track up by one post (530 px), with a snap
    const off = SW.reduce((a, at) => a + ss(at, at + .22, s), 0);
    $('#spTrack').style.transform = `translateY(${-off * 530}px)`;
    // likes
    const L = likesAt(s);
    $('#spLikes').textContent = L.toLocaleString('en-US');
    const heart = $('#spHeart'); heart.classList.toggle('on', s >= STOP);
    heart.style.transform = `scale(${1 + .5 * pulse(s, STOP, 5) + .15 * Math.abs(Math.sin(s * 18)) * ss(STOP, STOP + .5, s)})`;
    const hh = hearts.filter(h => s >= h.t0 && s < h.t0 + h.dur).slice(-46).map(h => {
      const p = (s - h.t0) / h.dur;
      return `<i style="transform:translate(${h.x + Math.sin(p * 6 + h.x) * 14}px,${-p * 330}px) scale(${h.s})">♥</i>`;
    }).join('');
    if (hh !== lastH) { $('#spHearts').innerHTML = hh; lastH = hh; }
    // comments sheet

    const C = cAt(s), shown = comments.filter(cm => cm.x <= s);
    $('#spCN').textContent = k(C);
    const html = shown.slice(-11).reverse().map((cm, i) => `<li class="${i === 0 ? 'new' : ''}"><i></i><div><b>${cm.who}</b> ${cm.text}<small>${i === 0 ? 'now' : `${1 + (i % 4)}m`} · ♡ ${(i * 37 + 12) % 400}</small></div></li>`).join('');
    if (html !== lastC) { $('#spList').innerHTML = html; lastC = html; }
    // the big numbers
    $('#spBigL').textContent = k(L); $('#spBigC').textContent = k(C);
    $('#spRateL').textContent = `+${Math.round(s < STOP ? 0 : 900 + 38000 * clamp((s - STOP) / 3.6)).toLocaleString('en-US')} / min`;
    $('#spRateC').textContent = `+${Math.round(s < SHEET ? 0 : 300 + 11000 * clamp((s - SHEET) / 2.9)).toLocaleString('en-US')} / min`;
    $('.sp-count.l').style.opacity = ss(STOP - .1, STOP + .25, s); $('.sp-count.r').style.opacity = ss(SHEET, SHEET + .3, s);
    $('#spBigL').style.transform = `scale(${1 + .25 * pulse(s, STOP, 6)})`; $('#spBigC').style.transform = `scale(${1 + .25 * pulse(s, SHEET + .2, 6)})`;
    $('.sp-phone').style.transform = `translateX(${Math.sin(t * 79) * 2.2 * ss(3.4, 4.4, s)}px) scale(${1 + .04 * ss(STOP, 5, s)})`;
  }
  ctx.start();
}
