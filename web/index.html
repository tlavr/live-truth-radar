<!doctype html>
<html lang="en" data-stage="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Swarm Radar</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0C100E;
  --surface:rgba(22,29,25,.76);
  --surface-solid:#161D19;
  --surface-hi:rgba(34,44,38,.84);
  --ink:#F2F6F3;
  --muted:rgba(218,232,222,.64);
  --tertiary:rgba(218,232,222,.38);
  --hairline:rgba(218,240,224,.12);
  --cool:#63CF97;
  --salat:#8EE87B;
  --warm:#B7F063;
  --peak:#FFE066;
  --accent:#FF5C9E;   /* the selected group: the same pink as on the map (PAL.sel in app.js) */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --gutter:clamp(16px,3vw,36px);
}
*{box-sizing:border-box}
html{
  color-scheme:dark;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
body{margin:0;overflow-x:hidden}
html:not([data-stage=result]) body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--salat);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---------- full-page stage ---------- */
.stage{position:relative;min-height:100svh;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
[data-stage=result] #scene{cursor:grab}
[data-stage=result] #scene.dragging{cursor:grabbing}
.veil{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(115% 88% at 50% 54%,transparent 40%,rgba(12,16,14,.74) 100%);
}

/* ---------- brand & centered Google-style search ---------- */
.brand{
  position:absolute;
  z-index:5;
  top:24px;
  left:var(--gutter);
  font-weight:600;
  font-size:16px;
  letter-spacing:-.015em;
  color:var(--ink);
  opacity:0;
  pointer-events:none;
  transform:translateY(-4px);
  transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out),color 160ms ease;
}
html:not([data-stage=home]) .brand{
  opacity:.92;
  pointer-events:auto;
  transform:translateY(0);
}
@media (hover:hover) and (pointer:fine){
  .brand:hover{color:var(--salat)}
}

.topbar{
  position:absolute;
  z-index:4;
  inset:0 0 auto 0;
  display:flex;
  justify-content:center;
  padding:16px var(--gutter) 0;
  pointer-events:none;
}
html[data-stage=home] .topbar{
  inset:0;
  align-items:center;
  padding:24px var(--gutter);
}
.search-shell{
  width:min(540px,calc(100vw - 360px));
  text-align:center;
  pointer-events:auto;
  transition:transform 420ms var(--ease-out);
}
html[data-stage=home] .search-shell{
  width:min(580px,100%);
  transform:translateY(-5vh);
}

.hero-wordmark{
  margin:0 0 22px;
  font-weight:600;
  font-size:clamp(34px,5vw,52px);
  letter-spacing:-.035em;
  line-height:1.05;
  color:var(--ink);
}
html:not([data-stage=home]) .hero-wordmark{display:none}
/* the dot of the "i" is the radar's beat: red, it flares in step with the sonar ring on the wave (app.js frame) */
.idot{position:relative;display:inline-block}
.idot i{position:absolute;left:50%;top:.035em;width:.2em;height:.2em;margin-left:-.1em;border-radius:50%;background:#FF4040;
  box-shadow:0 0 .3em rgba(255,64,64,.95),0 0 .08em #FF8080 inset;opacity:.75;will-change:transform,opacity}

.field{
  display:flex;
  align-items:center;
  gap:10px;
  height:52px;
  padding:0 6px 0 18px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--hairline);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 12px 32px rgba(0,0,0,.35);
  transition:border-color 180ms ease,background-color 180ms ease,box-shadow 200ms var(--ease-out),height 240ms var(--ease-out);
}
html:not([data-stage=home]) .field{
  height:42px;
  padding:0 5px 0 14px;
  box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.field:focus-within{
  border-color:rgba(142,232,123,.58);
  background:rgba(26,35,30,.9);
  /* nearly opaque when focused: drop the blur, so Safari does not re-composite it over the WebGL scene on click */
  backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 0 0 3px rgba(142,232,123,.14),0 12px 32px rgba(0,0,0,.42);
}
@media (hover:hover) and (pointer:fine){
  .field:hover{border-color:rgba(218,240,224,.24)}
}
.search-ico{flex:0 0 auto;width:17px;height:17px;color:var(--muted);pointer-events:none}
.field input{
  flex:1;
  min-width:0;
  background:none;
  border:0;
  outline:0;
  color:var(--ink);
  caret-color:var(--salat);
  font-family:var(--font);
  font-size:16.5px;
}
html:not([data-stage=home]) .field input{font-size:15px}
.field input::placeholder{color:var(--tertiary)}

.clear{
  display:none;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:50%;
  color:var(--muted);
  font-size:18px;
  line-height:1;
  transition:background-color 160ms ease,color 160ms ease,transform 160ms var(--ease-out);
}
.clear.visible{display:flex}
/* a topic's screen: the field is the topic's fixed name, not a search */
html:not([data-stage=home]) .search-ico,html:not([data-stage=home]) .clear{display:none!important}
html:not([data-stage=home]) .field input{font-weight:600;cursor:default;caret-color:transparent;pointer-events:none}
.clear:active{transform:scale(0.95)}
@media (hover:hover) and (pointer:fine){
  .clear:hover{color:var(--ink);background:rgba(255,255,255,.1)}
}

.play-btn,.stop-btn{flex:0 0 auto;position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;transition:transform 160ms var(--ease-out),filter 160ms ease,background-color 160ms ease,color 160ms ease}
.play-btn{background:linear-gradient(135deg,var(--salat),var(--cool));color:#08120B}
.play-btn svg,.stop-btn svg{width:18px;height:18px}
.play-btn .i-pause,.play-btn[data-state=pause] .i-play{display:none}
.play-btn[data-state=pause] .i-pause{display:block}
/* live: a soft ring keeps pulsing around the pause button while the topic is being scanned */
.play-btn[data-state=pause]::after{content:"";position:absolute;inset:0;border-radius:50%;animation:livePulse 1.6s ease-out infinite}
.stop-btn{color:var(--muted);background:rgba(255,255,255,.07)}
html[data-stage=home] .stop-btn{display:none}
.play-btn:active,.stop-btn:active{transform:scale(0.95)}
@media (hover:hover) and (pointer:fine){.play-btn:hover{filter:brightness(1.07)}.stop-btn:hover{color:var(--ink);background:rgba(255,255,255,.13)}}
html:not([data-stage=home]) .play-btn,html:not([data-stage=home]) .stop-btn{width:30px;height:30px}
html:not([data-stage=home]) .play-btn svg,html:not([data-stage=home]) .stop-btn svg{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){.play-btn[data-state=pause]::after{animation:none}}


/* ---------- pipeline (pinned high above the 3D surface) ---------- */
.pipe{
  position:absolute;
  z-index:3;
  left:50%;
  top:82px;
  transform:translateX(-50%);
  width:min(600px,calc(100vw - 2*var(--gutter)));
  text-align:center;
  visibility:hidden;
  opacity:0;
}
.pipe-now{margin:0 0 24px;min-height:3.8em}
.pipe-title{
  display:block;
  font-weight:600;
  font-size:clamp(24px,3.4vw,36px);
  letter-spacing:-.03em;
  line-height:1.1;
}
.pipe-fact{
  display:block;
  margin-top:6px;
  color:var(--salat);
  font-size:15px;
  font-variant-numeric:tabular-nums;
}
.pipe-track{position:relative;list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;text-align:left}
.pipe-track::before,.pipe-bar{content:"";position:absolute;left:6px;right:6px;top:6px;height:1px;background:rgba(218,240,224,.18)}
.pipe-bar{background:linear-gradient(90deg,var(--cool),var(--warm));transform:scaleX(0);transform-origin:left}
.pipe-track li{position:relative;width:13px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.pipe-track .dot{
  display:block;
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--bg);
  border:1px solid rgba(218,240,224,.36);
  transition:background 240ms ease,border-color 240ms ease,box-shadow 320ms ease;
}
.pipe-track .lbl{position:absolute;top:22px;left:50%;transform:translateX(-50%);transition:color 220ms ease}
.pipe-track li:first-child .lbl{left:0;transform:none}
.pipe-track li:last-child .lbl{left:auto;right:0;transform:none}
.pipe-track li.done .dot{background:var(--cool);border-color:var(--cool)}
.pipe-track li.on .dot{background:var(--warm);border-color:var(--warm);box-shadow:0 0 0 6px rgba(183,240,99,.18),0 0 18px rgba(183,240,99,.58)}
.pipe-track li.on .lbl{color:var(--ink)}
@media (max-width:560px){.pipe-track li:not(.on) .lbl{opacity:0}}

/* ---------- axes & tooltip ---------- */
.axes{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:0}
.axes span{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;color:var(--muted);will-change:transform}
.axes span.t{color:var(--salat);font-weight:500}
.axes span.k{color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums}
.axes span.thr{color:var(--thr,#FF5C9E);font-size:12px;font-weight:600;pointer-events:auto;cursor:help}

.tip{
  position:absolute;
  z-index:5;
  left:0;
  top:0;
  pointer-events:none;
  max-width:248px;
  padding:9px 12px;
  border-radius:12px;
  background:var(--surface);
  border:1px solid var(--hairline);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 10px 28px rgba(0,0,0,.42);
  font-size:13px;
  line-height:1.4;
  opacity:0;
  transition:opacity 150ms var(--ease-out);
  font-variant-numeric:tabular-nums;
}
.tip b{display:block;font-weight:600;color:var(--ink)}
.tip span{color:var(--salat)}
.tip em.thr{display:block;margin-top:5px;font-style:normal;color:var(--thr,#FF5C9E)}


/* ---------- result overlay: centered verdict top ---------- */
.result{
  position:relative;
  z-index:2;
  display:none;
  flex-direction:column;
  justify-content:space-between;
  min-height:100svh;
  padding:70px var(--gutter) 20px;
  pointer-events:none;
}
[data-stage=result] .result{display:flex}
.verdict{pointer-events:auto}
/* result: the plot has the whole first view */
[data-stage=result] .stage,[data-stage=result] .result{min-height:max(740px,100svh)}

.verdict{
  position:relative;
  max-width:640px;
  margin:0 auto;
  text-align:center;
}
.verdict h1{
  margin:0 auto;
  font-weight:700;
  font-size:clamp(34px,4.4vw,58px);
  letter-spacing:-.04em;
  line-height:1;
  margin-bottom:12px;
}
/* one accent, one meaning: the selected group. Filled = coordinated, outlined = possible, none = nothing found */
.verdict h1[data-v=coordinated]{color:var(--accent);text-shadow:0 0 28px rgba(255,92,158,.35)}
.verdict h1[data-v=watching]{color:var(--peak)}
.verdict h1[data-v=organic],.verdict h1[data-v=quiet]{color:var(--salat)}
.dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;border:1.5px solid var(--tertiary);vertical-align:0}
.dot[data-v=watching]{border-color:var(--peak)}
.dot[data-v=coordinated]{border-color:var(--accent);background:var(--accent)}
.verdict p{
  margin:10px auto 0;
  max-width:54ch;
  font-size:16px;
  color:rgba(242,246,243,.88);
}
/* which group is on screen: one tab per group above the verdict, which always describes the selected one */
.gtabs{display:flex;justify-content:center;justify-content:safe center;align-items:center;gap:6px;margin:0 auto 10px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gtabs:empty{display:none}
.gtab{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;padding:3px 11px 3px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--hairline);font-size:13px;color:var(--muted);white-space:nowrap;transition:color 160ms ease,border-color 160ms ease}
.gtab[aria-pressed=true]{border-color:rgba(255,92,158,.55);color:var(--ink)}
.gtab .dot{margin:0}
.gtab small{font-size:12px;color:var(--tertiary)}
.gsel{flex:0 1 auto;min-width:0;max-width:100%;height:30px;padding:0 30px 0 12px;border-radius:999px;border:1px solid rgba(255,92,158,.55);background-color:var(--surface);color:var(--ink);font:inherit;font-size:13px;appearance:none;-webkit-appearance:none;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.gsel option{background:var(--surface-solid);color:var(--ink)}
.gask{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--hairline);font-size:12px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.gtab:hover,.gask:hover{color:var(--ink);border-color:rgba(255,255,255,.28)}}
/* the selected group: its attack type, then the three ways to go deeper */
.verdict .gline{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 16px;margin-top:6px;max-width:none;font-size:13.5px;color:var(--ink)}
.gline:empty{display:none}
.gline .kind span{margin-right:5px;color:var(--muted)}
.gline .sim{color:var(--muted)}
.gline button,.gline a{color:var(--muted);text-decoration:none;white-space:nowrap}
.gline button::after,.gline a::after{content:" ›";color:var(--tertiary)}
.gline button[aria-expanded=true]{color:var(--ink)}
@media (hover:hover) and (pointer:fine){.gline button:hover,.gline a:hover{color:var(--ink)}}
/* answer to "Why" or "why separate?": a small panel right under the selected group's line, over the plot */
.gwrap{position:relative}
.pop{position:absolute;z-index:5;left:50%;top:100%;transform:translateX(-50%);width:min(580px,calc(100vw - 2*var(--gutter)));margin-top:8px;padding:10px 14px;border-radius:14px;background:var(--surface-solid);border:1px solid rgba(218,240,224,.22);box-shadow:0 14px 34px rgba(0,0,0,.5);text-align:left;font-size:13px;line-height:1.45;color:var(--muted)}
.verdict .pop p{margin:0;max-width:none;font-size:13.5px;color:var(--ink)}
.pop ul{margin:6px 0 0;padding:0;list-style:none}
/* Why: the reasons as one row of short chips under the sentence, not a narrow column */
#pop ul{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#pop li{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--hairline);font-size:12.5px;color:var(--ink);white-space:nowrap}
#pop{padding:12px 16px}
.pop .facts li{display:flex;align-items:baseline;gap:8px;margin-top:5px;color:var(--ink)}
.pop .facts .tag{width:18px;height:18px;font-size:11px;transform:translateY(2px)}
.pop .atk{margin:0 0 10px;padding:0 0 10px;border-bottom:1px solid var(--hairline)}
.pop .atk b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.pop .atk b span{margin-right:6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tertiary)}
.verdict .pop .atk p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.verdict .pop .note{margin-top:8px;font-size:12.5px;color:var(--muted)}
.gtab .span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}


@media (max-width:860px){
  html:not([data-stage=home]) .topbar{padding-top:52px}
  html:not([data-stage=home]) .search-shell{width:calc(100vw - 2*var(--gutter))}
  .brand{top:16px}
  .result{padding-top:112px}
  [data-stage=result] .stage,[data-stage=result] .result{min-height:100svh}
}
@media (prefers-reduced-motion:reduce){
  .search-shell,.field,.clear,.brand{transition:none}
}
/* ---------- live data additions (T12) ---------- */
.risk{margin:12px auto 0;max-width:60ch;font-size:15px;color:var(--ink)}
.risk small{display:block;margin-top:4px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(99,207,151,.55)}100%{box-shadow:0 0 0 8px rgba(99,207,151,0)}}
.viewbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2*var(--gutter));text-align:center;pointer-events:auto}
/* popover over the plot: it points at the picked column or post */
.pick{position:absolute;left:0;top:0;z-index:5;width:300px;padding:10px 12px;border-radius:14px;background:var(--surface-solid);border:1px solid rgba(218,240,224,.22);box-shadow:0 14px 34px rgba(0,0,0,.5);font-size:13px;line-height:1.4;color:var(--muted)}
.pick:empty{display:none!important}
.pick::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--surface-solid);border:solid rgba(218,240,224,.22);border-width:0 1px 1px 0}
.pick[data-below=true]::after{bottom:auto;top:-6px;border-width:1px 0 0 1px}
.pick b{display:block;color:var(--ink);font-weight:600}
.pick span{display:block}
.pick .say{margin-top:6px;font-size:13px;font-weight:500;color:var(--ink)}
.pick .say::after{content:" ›";color:var(--tertiary)}
/* each group's letter, on its tab and wherever the group is named */
.tag{display:inline-grid;place-items:center;flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:var(--bg);color:var(--ink);font-size:12px;font-weight:600;line-height:1}
.gtab[aria-pressed=true] .tag,.sheet .tag{border-color:var(--accent);background:var(--accent);color:var(--bg)}
/* "How we got here": the same sheet, wider, with the detector's steps (steps.css) as plain sections */
.sheet.wide{width:min(820px,calc(100vw - 32px));max-height:calc(100svh - 48px)}
.sheet#how{--sx:26px;width:min(680px,calc(100vw - 32px))}
.sheet .howtop{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;margin:0 calc(-1*var(--sx)) 6px;padding:16px var(--sx) 12px;background:linear-gradient(var(--surface-solid) 75%,rgba(22,29,25,0))}
.hback{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--hairline);
  font-size:13.5px;font-weight:600;color:var(--ink);transition:width 200ms ease,padding 200ms ease}
.hback svg{width:17px;height:17px;color:var(--salat)}
@media (hover:hover) and (pointer:fine){.hback:hover{border-color:rgba(142,232,123,.5)}}
.sheet.scrolled .hback{width:34px;padding:0;justify-content:center}
.sheet.scrolled .hback span{display:none}
.sheet .howtop h2{transition:opacity 200ms ease}
.sheet#how .lead{margin:0 0 6px;font-size:15.5px;color:var(--muted)}
.sheet#how .step{padding:20px 0}
.sheet .steps{display:grid}
.sheet .step{padding:16px 0;border:0;border-top:1px solid var(--hairline);border-radius:0;background:none}
/* "What they say": a sheet over the page */
.sheet{width:min(560px,calc(100vw - 32px));max-height:min(720px,calc(100svh - 48px));--sx:22px;padding:0 var(--sx) var(--sx);border:1px solid var(--hairline);border-radius:18px;background:var(--surface-solid);color:var(--ink);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sheet::backdrop{background:rgba(6,9,7,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sheet h2 small{white-space:nowrap;margin-left:8px;font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}
.sheet .lead{margin:0 0 10px;font-size:15px;line-height:1.45;color:var(--ink)}
.sheet blockquote{margin:0 0 16px;padding-left:12px;border-left:2px solid var(--tertiary);font-size:15px;line-height:1.4;color:var(--muted)}
.sheet h3{margin:16px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.points{margin:0;padding:0;list-style:none;display:grid;gap:1px;border-radius:12px;overflow:hidden}
/* short versions: a point shows 3 lines (its sheet has the full text), a post 4 lines with "Read more" */
.clip{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.posts .clip{-webkit-line-clamp:4;line-clamp:4}
.posts li.open .clip{display:block;-webkit-line-clamp:unset;line-clamp:none;overflow:visible}

            <input id="q" name="q" type="text" enterkeyhint="search" placeholder="Pick a topic" spellcheck="false" autofocus
              role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
            <!-- the topic picker: the monitored topics and the latest alerts, filtered as you type -->
            <div class="suggest" id="suggest" role="listbox" aria-label="Topics and latest alerts" hidden></div>
            <button class="clear" type="button" id="clear" aria-label="Clear search">&times;</button>
          </div>
          <!-- second pill: the scan of the topic, play/pause and stop, then its sensitivity -->
          <div class="ctrl" role="group" aria-label="Scan">
            <!-- player controls: play = check the topic / resume its live scan, pause = pause the scan, stop = end it -->
            <button class="play-btn" id="playBtn" type="submit" data-state="play" aria-label="Check" title="Check">
              <svg class="i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.6v10.8a.8.8 0 0 0 1.2.7l8.6-5.4a.8.8 0 0 0 0-1.4L8.2 3.9a.8.8 0 0 0-1.2.7z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 20 20" aria-hidden="true"><rect x="5.2" y="4" width="3.4" height="12" rx="1" fill="currentColor"/><rect x="11.4" y="4" width="3.4" height="12" rx="1" fill="currentColor"/></svg>
            </button>
            <button class="stop-btn" id="stopBtn" type="button" aria-label="Stop the scan" title="Stop">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.6" fill="currentColor"/></svg>
            </button>
            <span class="sep" aria-hidden="true"></span>
            <button class="sens-btn" id="alphaChip" type="button" aria-expanded="false" aria-controls="fa" aria-label="Sensitivity" title="Sensitivity">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <circle cx="10" cy="10" r="1.6" fill="currentColor" stroke="none"/>
                <path d="M6.6 6.6a4.8 4.8 0 0 0 0 6.8M13.4 6.6a4.8 4.8 0 0 1 0 6.8"/>
                <path d="M4.1 4.1a8.3 8.3 0 0 0 0 11.8M15.9 4.1a8.3 8.3 0 0 1 0 11.8" opacity=".55"/>
              </svg>
            </button>
            <!-- sensitivity: the sonar button opens a small menu under the search, a slider and one line; details behind "!" -->
            <div class="fa" id="fa" hidden>
              <div class="fa-head">
                <svg class="fa-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="1.6" fill="currentColor" stroke="none"/><path d="M6.6 6.6a4.8 4.8 0 0 0 0 6.8M13.4 6.6a4.8 4.8 0 0 1 0 6.8"/><path d="M4.1 4.1a8.3 8.3 0 0 0 0 11.8M15.9 4.1a8.3 8.3 0 0 1 0 11.8" opacity=".55"/></svg>
                <label class="fa-title" for="alphaRange">Target false alarm probability</label>
                <output class="fa-val" id="alphaVal" for="alphaRange">2%</output>
                <button class="fa-info" id="alphaInfo" type="button" aria-expanded="false" aria-controls="alphaMore" aria-label="Details" title="Details">!</button>
              </div>
              <div class="fa-track">
                <input id="alphaRange" type="range" min="0" max="4" step="1" value="2" aria-describedby="alphaHint">
                <div class="fa-stops" id="alphaStops" aria-hidden="true"></div>
              </div>
              <p class="fa-hint" id="alphaHint"></p>
              <p class="fa-demo" id="alphaDemo"></p>
              <div class="fa-more" id="alphaMore" hidden><p id="alphaDetail"></p><p class="fa-meas" id="alphaMeas"></p></div>
            </div>
          </div>
        </div>
      </form>
    </header>

    <section class="pipe" id="pipe" aria-live="polite">
      <p class="pipe-now" id="pipeNow"><span class="pipe-title" id="pipeTitle"></span><span class="pipe-fact" id="pipeFact"></span></p>
      <ol class="pipe-track" id="pipeTrack">
        <span class="pipe-bar" id="pipeBar"></span>
        <li><span class="dot"></span><span class="lbl">Collect</span></li>
        <li><span class="dot"></span><span class="lbl">Meaning</span></li>
        <li><span class="dot"></span><span class="lbl">Timing</span></li>
        <li><span class="dot"></span><span class="lbl">Noise</span></li>
        <li><span class="dot"></span><span class="lbl">Verdict</span></li>
      </ol>
    </section>

    <div class="axes" id="axes"></div>
    <div class="tip" id="tip"></div>
    <div class="pick" id="pick" aria-live="polite"></div>
    <!-- the update countdown at the map's origin: an antenna that fills from the ground up (app.js placeTick) -->
    <svg class="tick" id="tick" viewBox="0 0 24 32" aria-hidden="true">
      <defs><clipPath id="tickClip"><rect id="tickFill" x="0" y="32" width="24" height="0"/></clipPath></defs>
      <g class="dim"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v21M6 30l6-19 6 19M8.1 23.5h7.8M9.6 18.5h4.8"/><path d="M7.3 4.6a6.6 6.6 0 0 0 0 7.6M16.7 4.6a6.6 6.6 0 0 1 0 7.6M4.6 2.4a10 10 0 0 0 0 12M19.4 2.4a10 10 0 0 1 0 12"/></g><circle cx="12" cy="8.4" r="1.9"/></g>
      <g class="lit" clip-path="url(#tickClip)"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v21M6 30l6-19 6 19M8.1 23.5h7.8M9.6 18.5h4.8"/><path d="M7.3 4.6a6.6 6.6 0 0 0 0 7.6M16.7 4.6a6.6 6.6 0 0 1 0 7.6M4.6 2.4a10 10 0 0 0 0 12M19.4 2.4a10 10 0 0 1 0 12"/></g><circle cx="12" cy="8.4" r="1.9"/></g>
    </svg>

    <div class="result" id="result">
      <div class="verdict" id="vHead">
        <h1 id="vTitle"></h1>
        <div class="gtabs" id="groups" role="group" aria-label="Groups in this topic"></div>
        <div class="gwrap">
          <p class="gline" id="gLine"></p>
          <div class="pop" id="pop" hidden></div>
        </div>
      </div>

      <div class="viewbar" id="viewbar">
        <div class="strip" id="strip" tabindex="0" role="group" aria-label="Groups over time: drag to pan, scroll to zoom, select a group"></div>
      </div>
    </div>
  </div>

  <dialog class="sheet" id="says" aria-label="What they say"></dialog>
  <dialog class="sheet wide" id="how" aria-label="How we got here"></dialog>
  <dialog class="sheet" id="posts" aria-label="Posts grouped under a point"></dialog>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
