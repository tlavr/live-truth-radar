<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Swarm Radar · How we got here</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0C100E;--surface:#161D19;--ink:#F2F6F3;--muted:rgba(218,232,222,.64);--tertiary:rgba(218,232,222,.38);
  --hairline:rgba(218,240,224,.12);--cool:#63CF97;--salat:#8EE87B;--warm:#B7F063;--peak:#FFE066;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;--gutter:clamp(16px,3vw,36px);
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased}
body{margin:0;padding:24px var(--gutter) 72px;background:var(--bg)}
a{color:var(--salat);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;max-width:880px;margin:0 auto 28px}
header b{font-weight:600;letter-spacing:-.015em}
header a.back{font-size:13px}
main{max-width:880px;margin:0 auto;display:grid;gap:18px}
#steps{display:grid;gap:14px}
h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-.035em;line-height:1.08}
.sub{margin:8px 0 0;color:var(--muted);max-width:68ch}
/* the dashboard's verdict marks: one accent, filled = coordinated, outlined = possible, none = nothing unusual */
.dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;border:1.5px solid var(--tertiary)}
.dot[data-v=watching]{border-color:var(--peak)}
.dot[data-v=coordinated]{border-color:var(--peak);background:var(--peak)}
h1[data-v=coordinated]{color:var(--peak)}
h1[data-v=organic]{color:var(--muted)}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.where select{max-width:100%;padding:3px 26px 3px 10px;border-radius:999px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink);font:inherit;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
<link rel="stylesheet" href="/steps.css">
</head>
<body>
<header><a href="/"><b>Live Swarm Radar</b></a><a class="back" id="back" href="/">← Back to the topic</a></header>
<main id="main" aria-live="polite">
  <section>
    <p class="where" id="where">How we got here</p>
    <h1 id="title">How we got here</h1>
    <p class="sub" id="intro">Loading…</p>
  </section>
  <div id="steps"></div>
</main>
<script type="module" src="/explain.js"></script>
</body>
</html>
