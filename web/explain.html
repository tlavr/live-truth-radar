<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Truth Radar · How we got here</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0C100E;--surface:#161D19;--ink:#F2F6F3;--muted:rgba(218,232,222,.64);--tertiary:rgba(218,232,222,.38);
  --hairline:rgba(218,240,224,.12);--cool:#63CF97;--salat:#8EE87B;--warm:#B7F063;--peak:#FFE066;--alarm:#FF7A6B;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;--gutter:clamp(16px,3vw,36px);
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased}
body{margin:0;padding:24px var(--gutter) 72px;background:var(--bg)}
a{color:var(--salat);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;max-width:880px;margin:0 auto 28px}
header b{font-weight:600;letter-spacing:-.015em}
header a.back{font-size:13px}
main{max-width:880px;margin:0 auto;display:grid;gap:18px}
h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-.035em;line-height:1.08}
.sub{margin:8px 0 0;color:var(--muted);max-width:68ch}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--hairline)}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;
  color:var(--bg);background:var(--cool);font-variant-numeric:tabular-nums}
.step.final .num{background:var(--peak)}
.step h2{margin:4px 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.step .say{margin:0 0 12px;font-size:15px}
.step .hint{margin:10px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.step svg{display:block;width:100%;height:auto;max-width:640px}
.corr{display:grid;gap:2px;max-width:420px}
.corr div{aspect-ratio:1;border-radius:3px;background:rgba(183,240,99,var(--v));cursor:pointer}
.corr div.self{background:rgba(255,255,255,.06);cursor:default}
.pick{min-height:1.4em;margin:8px 0 0;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px;max-width:560px}
.bars div{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.bars i{display:block;height:12px;border-radius:6px;background:var(--warm);min-width:2px}
.bars span:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.note{padding:8px 12px;border-left:2px solid var(--peak);background:rgba(255,224,102,.06);font-size:14px}
.verdict{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:14px}
.verdict[data-v=coordinated]{background:rgba(255,122,107,.16);color:var(--alarm)}
.verdict[data-v=watching]{background:rgba(255,224,102,.14);color:var(--peak)}
.verdict[data-v=organic]{background:rgba(99,207,151,.14);color:var(--cool)}
blockquote{margin:10px 0;padding-left:12px;border-left:2px solid var(--hairline);color:var(--ink)}
.empty{color:var(--tertiary)}
code{font-size:.92em}
@media (max-width:560px){.step{grid-template-columns:28px minmax(0,1fr);gap:10px;padding:14px}.num{width:28px;height:28px;font-size:13px}.bars div{grid-template-columns:80px minmax(0,1fr) 62px}}
</style>
</head>
<body>
<header><a href="/"><b>Live Truth Radar</b></a><a class="back" id="back" href="/">← Back to the radar</a></header>
<main id="main" aria-live="polite">
  <section>
    <h1>How we got here</h1>
    <p class="sub" id="intro">Loading the alert…</p>
  </section>
  <div id="steps"></div>
</main>
<script type="module" src="/explain.js"></script>
</body>
</html>
