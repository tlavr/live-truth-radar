<!doctype html>
<html lang="en" data-stage="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Truth Radar</title>
<style>
:root{
  --bg:#0C100E;
  --surface:rgba(22,29,25,.76);
  --surface-solid:#161D19;
  --surface-hi:rgba(34,44,38,.84);
  --ink:#F2F6F3;
  --muted:rgba(218,232,222,.64);
  --tertiary:rgba(218,232,222,.38);
  --hairline:rgba(218,240,224,.12);
  --cool:#63CF97;
  --salat:#8EE87B;
  --warm:#B7F063;
  --peak:#FFE066;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --gutter:clamp(16px,3vw,36px);
}
*{box-sizing:border-box}
html{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
body{margin:0;overflow-x:hidden}
html:not([data-stage=result]) body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--salat);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---------- full-page stage ---------- */
.stage{position:relative;min-height:100svh;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
[data-stage=result] #scene{cursor:grab}
[data-stage=result] #scene.dragging{cursor:grabbing}
.veil{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(115% 88% at 50% 54%,transparent 40%,rgba(12,16,14,.74) 100%);
}

/* ---------- brand & centered Google-style search ---------- */
.brand{
  position:absolute;
  z-index:5;
  top:24px;
  left:var(--gutter);
  font-weight:600;
  font-size:16px;
  letter-spacing:-.015em;
  color:var(--ink);
  opacity:0;
  pointer-events:none;
  transform:translateY(-4px);
  transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out),color 160ms ease;
}
html:not([data-stage=home]) .brand{
  opacity:.92;
  pointer-events:auto;
  transform:translateY(0);
}
@media (hover:hover) and (pointer:fine){
  .brand:hover{color:var(--salat)}
}

.topbar{
  position:absolute;
  z-index:4;
  inset:0 0 auto 0;
  display:flex;
  justify-content:center;
  padding:16px var(--gutter) 0;
  pointer-events:none;
}
html[data-stage=home] .topbar{
  inset:0;
  align-items:center;
  padding:24px var(--gutter);
}
.search-shell{
  width:min(540px,calc(100vw - 360px));
  text-align:center;
  pointer-events:auto;
  transition:transform 420ms var(--ease-out);
}
html[data-stage=home] .search-shell{
  width:min(580px,100%);
  transform:translateY(-5vh);
}

.hero-wordmark{
  margin:0 0 22px;
  font-weight:600;
  font-size:clamp(34px,5vw,52px);
  letter-spacing:-.035em;
  line-height:1.05;
  color:var(--ink);
}
html:not([data-stage=home]) .hero-wordmark{display:none}

.field{
  display:flex;
  align-items:center;
  gap:10px;
  height:52px;
  padding:0 6px 0 18px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--hairline);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 12px 32px rgba(0,0,0,.35);
  transition:border-color 180ms ease,background-color 180ms ease,box-shadow 200ms var(--ease-out),height 240ms var(--ease-out);
}
html:not([data-stage=home]) .field{
  height:42px;
  padding:0 5px 0 14px;
  box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.field:focus-within{
  border-color:rgba(142,232,123,.58);
  background:rgba(26,35,30,.9);
  box-shadow:0 0 0 3px rgba(142,232,123,.14),0 12px 32px rgba(0,0,0,.42);
}
@media (hover:hover) and (pointer:fine){
  .field:hover{border-color:rgba(218,240,224,.24)}
}
.search-ico{flex:0 0 auto;width:17px;height:17px;color:var(--muted);pointer-events:none}
.field input{
  flex:1;
  min-width:0;
  background:none;
  border:0;
  outline:0;
  color:var(--ink);
  caret-color:var(--salat);
  font-family:var(--font);
  font-size:16.5px;
}
html:not([data-stage=home]) .field input{font-size:15px}
.field input::placeholder{color:var(--tertiary)}

.clear{
  display:none;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:50%;
  color:var(--muted);
  font-size:18px;
  line-height:1;
  transition:background-color 160ms ease,color 160ms ease,transform 160ms var(--ease-out);
}
.clear.visible,html:not([data-stage=home]) .clear{display:flex}
.clear:active{transform:scale(0.95)}
@media (hover:hover) and (pointer:fine){
  .clear:hover{color:var(--ink);background:rgba(255,255,255,.1)}
}

.submit-btn{
  flex:0 0 auto;
  height:38px;
  padding:0 16px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--salat),var(--cool));
  color:#08120B;
  font-weight:600;
  font-size:14px;
  letter-spacing:-.01em;
  transition:transform 160ms var(--ease-out),filter 160ms ease;
}
html:not([data-stage=home]) .submit-btn{height:30px;padding:0 13px;font-size:13px}
.submit-btn:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){
  .submit-btn:hover{filter:brightness(1.07)}
}

.samples{
  margin-top:14px;
  display:flex;
  justify-content:center;
  gap:8px;
}
html:not([data-stage=home]) .samples{display:none}
.sample-chip{
  padding:5px 13px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--hairline);
  color:var(--muted);
  font-size:13px;
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  transition:color 160ms ease,border-color 160ms ease,transform 160ms var(--ease-out);
}
.sample-chip:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){
  .sample-chip:hover{color:var(--ink);border-color:rgba(142,232,123,.48)}
}

/* ---------- pipeline (pinned high above the 3D surface) ---------- */
.pipe{
  position:absolute;
  z-index:3;
  left:50%;
  top:82px;
  transform:translateX(-50%);
  width:min(600px,calc(100vw - 2*var(--gutter)));
  text-align:center;
  visibility:hidden;
  opacity:0;
}
.pipe-now{margin:0 0 24px;min-height:3.8em}
.pipe-title{
  display:block;
  font-weight:600;
  font-size:clamp(24px,3.4vw,36px);
  letter-spacing:-.03em;
  line-height:1.1;
}
.pipe-fact{
  display:block;
  margin-top:6px;
  color:var(--salat);
  font-size:15px;
  font-variant-numeric:tabular-nums;
}
.pipe-track{position:relative;list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;text-align:left}
.pipe-track::before,.pipe-bar{content:"";position:absolute;left:6px;right:6px;top:6px;height:1px;background:rgba(218,240,224,.18)}
.pipe-bar{background:linear-gradient(90deg,var(--cool),var(--warm));transform:scaleX(0);transform-origin:left}
.pipe-track li{position:relative;width:13px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.pipe-track .dot{
  display:block;
  width:13px;
  height:13px;
  border-radius:50%;
  background:var(--bg);
  border:1px solid rgba(218,240,224,.36);
  transition:background 240ms ease,border-color 240ms ease,box-shadow 320ms ease;
}
.pipe-track .lbl{position:absolute;top:22px;left:50%;transform:translateX(-50%);transition:color 220ms ease}
.pipe-track li:first-child .lbl{left:0;transform:none}
.pipe-track li:last-child .lbl{left:auto;right:0;transform:none}
.pipe-track li.done .dot{background:var(--cool);border-color:var(--cool)}
.pipe-track li.on .dot{background:var(--warm);border-color:var(--warm);box-shadow:0 0 0 6px rgba(183,240,99,.18),0 0 18px rgba(183,240,99,.58)}
.pipe-track li.on .lbl{color:var(--ink)}
@media (max-width:560px){.pipe-track li:not(.on) .lbl{opacity:0}}

/* ---------- axes & tooltip ---------- */
.axes{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:0}
.axes span{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;color:var(--muted);will-change:transform}
.axes span.t{color:var(--salat);font-weight:500}

.tip{
  position:absolute;
  z-index:5;
  left:0;
  top:0;
  pointer-events:none;
  max-width:248px;
  padding:9px 12px;
  border-radius:12px;
  background:var(--surface);
  border:1px solid var(--hairline);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 10px 28px rgba(0,0,0,.42);
  font-size:13px;
  line-height:1.4;
  opacity:0;
  transition:opacity 150ms var(--ease-out);
  font-variant-numeric:tabular-nums;
}
.tip b{display:block;font-weight:600;color:var(--ink)}
.tip span{color:var(--salat)}

/* ---------- result overlay: centered verdict top, explanations bottom ---------- */
.result{
  position:relative;
  z-index:2;
  display:none;
  flex-direction:column;
  justify-content:space-between;
  min-height:100svh;
  padding:78px var(--gutter) 20px;
  pointer-events:none;
}
[data-stage=result] .result{display:flex}
.verdict,.legend-bar{pointer-events:auto}

.verdict{
  max-width:640px;
  margin:0 auto;
  text-align:center;
}
.verdict h1{
  margin:0 auto;
  font-weight:700;
  font-size:clamp(38px,5vw,66px);
  letter-spacing:-.04em;
  line-height:1;
}
.verdict h1[data-v=coordinated]{
  background:linear-gradient(95deg,var(--warm) 10%,var(--peak));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.verdict h1[data-v=organic]{color:var(--salat)}
.verdict h1[data-v=watching]{color:var(--ink)}
.verdict p{
  margin:10px auto 0;
  max-width:54ch;
  font-size:16px;
  color:rgba(242,246,243,.88);
}
.groups{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:16px;
}
.groups button{
  padding:6px 14px;
  border-radius:999px;
  border:1px solid var(--hairline);
  background:var(--surface);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  color:var(--muted);
  font-size:13.5px;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease,transform 160ms var(--ease-out);
}
.groups button:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){
  .groups button:hover{border-color:rgba(255,255,255,.28);color:var(--ink)}
}
.groups button[aria-pressed=true]{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--bg);
  font-weight:500;
}

.legend-bar{
  width:min(980px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr)) auto;
  gap:8px;
  padding:8px;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--hairline);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
}
.legend-bar .lg-btn{
  display:grid;
  grid-template-columns:12px 1fr;
  gap:10px;
  text-align:left;
  padding:9px 11px;
  border-radius:11px;
  transition:background-color 160ms ease,transform 160ms var(--ease-out);
}
.legend-bar .lg-btn:active{transform:scale(0.985)}
@media (hover:hover) and (pointer:fine){
  .legend-bar .lg-btn:hover{background:rgba(255,255,255,.06)}
}
.legend-bar .lg-btn[aria-pressed=true]{background:rgba(142,232,123,.14)}
.legend-bar b{display:block;font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:2px}
.legend-bar span{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.legend-bar i{width:12px;height:12px;margin-top:3px;border-radius:50%}
.sw-spike{background:linear-gradient(180deg,var(--peak),var(--warm))}
.sw-carpet{background:var(--cool);opacity:.9}
.sw-floor{border:1.5px solid var(--cool);border-radius:3px!important}

.cam-reset{
  align-self:center;
  padding:8px 13px;
  border-radius:10px;
  color:var(--muted);
  font-size:12.5px;
  white-space:nowrap;
  transition:color 160ms ease,background-color 160ms ease,transform 160ms var(--ease-out);
}
.cam-reset:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){
  .cam-reset:hover{color:var(--ink);background:rgba(255,255,255,.08)}
}

/* ---------- evidence (concise, below full-page chart) ---------- */
.evidence{
  display:none;
  position:relative;
  z-index:2;
  padding:52px var(--gutter) 76px;
  background:var(--bg);
  border-top:1px solid var(--hairline);
}
[data-stage=result] .evidence{display:block}
.evidence-in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 56px}
.evidence h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--salat)}
.evidence p{margin:0;color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums}
.evidence blockquote{margin:0 0 10px;font-weight:500;font-size:clamp(19px,2.1vw,24px);line-height:1.25;letter-spacing:-.02em;color:var(--ink)}
.evidence svg{display:block;width:100%;height:auto;margin-bottom:10px;overflow:visible}
.bars{display:grid;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.bars div{display:grid;grid-template-columns:96px 1fr 56px;gap:12px;align-items:center}
.bars span:first-child{color:var(--muted)}
.bars i{height:7px;border-radius:4px;background:var(--cool);transform-origin:left}
.bars div:last-child i{background:linear-gradient(90deg,var(--warm),var(--peak))}
.who{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px;padding:0;list-style:none}
.who li{padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--hairline);font-size:13.5px;color:var(--ink)}

@media (max-width:860px){
  html:not([data-stage=home]) .topbar{padding-top:52px}
  html:not([data-stage=home]) .search-shell{width:calc(100vw - 2*var(--gutter))}
  .brand{top:16px}
  .pipe{top:112px}
  .result{padding-top:112px}
  .legend-bar{grid-template-columns:1fr;margin-top:34svh}
  .cam-reset{justify-self:start}
  .evidence-in{grid-template-columns:1fr;gap:32px}
  .axes span:not(.t){display:none}
}
@media (prefers-reduced-motion:reduce){
  .search-shell,.field,.submit-btn,.clear,.groups button,.legend-bar .lg-btn,.brand,.cam-reset{transition:none}
}
</style>
</head>
<body>

<main>
  <div class="stage" id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="veil"></div>
    <button class="brand" id="brandBtn" type="button" aria-label="Live Truth Radar home">Live Truth Radar</button>

    <header class="topbar">
      <form class="search-shell" id="search" role="search" autocomplete="off">
        <h1 class="hero-wordmark">Live Truth Radar</h1>
        <div class="field">
          <svg class="search-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="8.75" cy="8.75" r="5.75"/>
            <path d="M13 13l4.2 4.2" stroke-linecap="round"/>
          </svg>
          <label class="sr" for="q">Topic</label>
          <input id="q" name="q" type="text" enterkeyhint="search" placeholder="Search topic" spellcheck="false" autofocus>
          <button class="clear" type="button" id="clear" aria-label="Clear search">&times;</button>
          <button class="submit-btn" type="submit">Check</button>
        </div>
        <div class="samples">
          <button class="sample-chip" type="button" data-sample="helsinki-tram-fares">helsinki-tram-fares</button>
        </div>
      </form>
    </header>

    <section class="pipe" id="pipe" aria-live="polite">
      <p class="pipe-now" id="pipeNow"><span class="pipe-title" id="pipeTitle"></span><span class="pipe-fact" id="pipeFact"></span></p>
      <ol class="pipe-track" id="pipeTrack">
        <span class="pipe-bar" id="pipeBar"></span>
        <li><span class="dot"></span><span class="lbl">Collect</span></li>
        <li><span class="dot"></span><span class="lbl">Meaning</span></li>
        <li><span class="dot"></span><span class="lbl">Timing</span></li>
        <li><span class="dot"></span><span class="lbl">Noise</span></li>
        <li><span class="dot"></span><span class="lbl">Verdict</span></li>
      </ol>
    </section>

    <div class="axes" id="axes"></div>
    <div class="tip" id="tip"></div>

    <div class="result" id="result">
      <div class="verdict">
        <h1 id="vTitle"></h1>
        <p id="vText"></p>
        <div class="groups" id="groups" role="group" aria-label="Groups in this topic"></div>
      </div>

      <div class="legend-bar" id="legend">
        <button class="lg-btn" type="button" data-cam="peak"><i class="sw-spike"></i><div><b>Spike</b><span id="lgSpike"></span></div></button>
        <button class="lg-btn" type="button" data-cam="carpet"><i class="sw-carpet"></i><div><b>Carpet</b><span id="lgCarpet"></span></div></button>
        <button class="lg-btn" type="button" data-cam="top"><i class="sw-floor"></i><div><b>Axes</b><span>Lag (0–10m), wording gap, pair count</span></div></button>
        <button class="cam-reset" id="resetCam" type="button">Reset</button>
      </div>
    </div>
  </div>

  <section class="evidence" id="evidence" aria-label="Evidence">
    <div class="evidence-in">
      <div id="evSay"></div>
      <div id="evDecision"></div>
      <div id="evSignal"></div>
      <div id="evWho"></div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ data

function smooth(grid) {

      const u = U0 + i / (NX - 1) * (U1 - U0);

      for (let m = Math.floor(v - 3); m <= Math.ceil(v + 3); m++)

          const du = u - (l + .5), dv = v - (m + .5);

}

  {title: 'Collecting posts', fact: n => `${Math.round(n * TOPIC.posts)} posts from ${Math.round(n * TOPIC.accounts)} accounts (${TOPIC.windowHours}h)`, dur: 1.4},
  {title: 'Comparing meaning', fact: () => `${TOPIC.posts} posts embedded`, dur: 1.1},
  {title: 'Aligning timing', fact: n => `${Math.round(n * pairsTotal)} post pairs`, dur: 1.4},
  {title: 'Estimating noise', fact: () => `False positive cap ${TOPIC.alpha * 100}%`, dur: 1.1},
  {title: 'Deciding', fact: () => `Decided at post ${A.decided_at_item + 1}`, dur: 1.4},
];
const dots = [...document.querySelectorAll('#pipeTrack li')];
let tl = null, selTl = null;

function setPhase(i) {
  $('pipeTitle').textContent = PHASES[i].title;
  $('pipeFact').textContent = PHASES[i].fact(i === 0 || i === 2 ? 0 : 1);
  dots.forEach((d, k) => { d.classList.toggle('done', k < i); d.classList.toggle('on', k === i); });
}
function run(query, instant) {
  tl?.kill(); selTl?.kill();
  gsap.killTweensOf([U.uCarpet, U.uPeak, U.uNoise, U.uGlow, U.uSweep, U.uSweepOn, U.uSel, axisMat, cam]);
  sel = 0; U.uSel.value = 0; U.uCarpet.value = 0; U.uPeak.value = 0; axisMat.opacity = 0;
  root.dataset.stage = 'scan'; scrollTo(0, 0); hideTip();
  $('q').value = query; $('q').blur(); syncClear();
  gsap.set('#pipe', {autoAlpha: 0}); gsap.set('#pipeBar', {scaleX: 0}); gsap.set('#axes', {opacity: 0});
  const now = $('pipeNow');
  tl = gsap.timeline({defaults: {ease: 'power3.out'}, onComplete: () => showResult(instant)});
  tl.to('#pipe', {autoAlpha: 1, duration: .45}, .25);
  tl.add(camTo('scan', 2.0), 0).to(U.uGlow, {value: .55, duration: 1}, 0);
  let at = .4;
  PHASES.forEach((p, i) => {
    const lab = 'p' + i; tl.addLabel(lab, at);
    if (i) tl.to(now, {autoAlpha: 0, y: -8, duration: .16, ease: 'power2.in'}, lab + '-=.16');
    tl.call(setPhase, [i], lab)
      .fromTo(now, {autoAlpha: 0, y: 10}, {autoAlpha: 1, y: 0, duration: .4}, lab)
      .to('#pipeBar', {scaleX: i / (PHASES.length - 1), duration: .45, ease: 'power2.inOut'}, lab + '-=.25');
    if (i === 0 || i === 2) {
      const n = {v: 0};
      tl.to(n, {v: 1, duration: p.dur * .75, ease: 'power2.out', onUpdate: () => { $('pipeFact').textContent = p.fact(n.v); }}, lab);
    }
    at += p.dur;
  });
  tl.set(U.uSweepOn, {value: 1}, 'p0')
    .fromTo(U.uSweep, {value: -W / 2 - 1.5}, {value: W / 2 + 1.5, duration: 1.3, ease: 'power1.inOut'}, 'p0')
    .fromTo(U.uSweep, {value: W / 2 + 1.5}, {value: -W / 2 - 1.5, duration: 1.0, ease: 'power1.inOut'}, 'p1')
    .set(U.uSweepOn, {value: 0}, 'p2')
    .to(U.uCarpet, {value: 1, duration: 1.3, ease: 'power2.out'}, 'p2')
    .to(U.uNoise, {value: .12, duration: 1.0, ease: 'power2.inOut'}, 'p3')
    .to(U.uGlow, {value: .82, duration: 1.0}, 'p3')
    .add(camTo('over', 1.8, 'power2.inOut'), 'p4-=.3')
    .to(U.uPeak, {value: 1, duration: 1.2, ease: 'expo.out'}, 'p4+=.3')
    .fromTo(bloom, {strength: 1.0}, {strength: .38, duration: 1.3, ease: 'power2.out'}, 'p4+=.3')
    .call(() => dots.forEach(d => { d.classList.add('done'); d.classList.remove('on'); }), [], '>-0.3');
  if (instant || reduced) tl.progress(1);
}
function showResult(instant) {
  render(0);
  root.dataset.stage = 'result';
  resize();
  const d = reduced || instant ? 0 : 1;
  gsap.to('#pipe', {autoAlpha: 0, duration: .25 * d});
  gsap.fromTo('#vTitle', {autoAlpha: 0, y: 14}, {autoAlpha: 1, y: 0, duration: .45 * d, ease: 'power3.out'});
  gsap.fromTo('#vText', {autoAlpha: 0, y: 8}, {autoAlpha: 1, y: 0, duration: .4 * d, delay: .06 * d, ease: 'power3.out'});
  gsap.fromTo('#groups', {autoAlpha: 0, y: 6}, {autoAlpha: 1, y: 0, duration: .38 * d, delay: .11 * d, ease: 'power3.out'});
  gsap.fromTo('#legend', {autoAlpha: 0, y: 8}, {autoAlpha: 1, y: 0, duration: .45 * d, delay: .18 * d, ease: 'power3.out'});
  gsap.to('#axes', {opacity: 1, duration: .55 * d, delay: .2 * d});
  gsap.to(axisMat, {opacity: .42, duration: .55 * d, delay: .2 * d});
}
function goHome() {
  tl?.kill(); selTl?.kill();
  gsap.killTweensOf('#pipe,#pipeNow,#vTitle,#vText,#groups,#legend,#axes');
  const d = reduced ? 0 : 1;
  gsap.to('#pipe', {autoAlpha: 0, duration: .22 * d});
  gsap.to([U.uCarpet, U.uPeak, U.uSel], {value: 0, duration: .85 * d, ease: 'power3.inOut', overwrite: true});
  gsap.to(U.uNoise, {value: 1, duration: .85 * d, overwrite: true});
  gsap.to(U.uGlow, {value: .3, duration: .85 * d, overwrite: true});
  gsap.to(axisMat, {opacity: 0, duration: .25 * d, overwrite: true});
  gsap.set(U.uSweepOn, {value: 0}); bloom.strength = .38;
  camTo('home', 1.1); setLegend(null); hideTip();
  root.dataset.stage = 'home'; scrollTo(0, 0); resize();
  $('q').value = ''; syncClear(); $('q').focus();
}

/* ------------------------------------------------------------------ result copy */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hm = iso => iso.slice(11, 16);

function render(i) {
  const f = FINDINGS[i], hit = f.verdict === 'coordinated', n = f.accounts.length, pairs = sum(f.ambiguity.counts);
  const vt = $('vTitle'); vt.dataset.v = f.verdict;
  vt.textContent = hit ? 'Coordinated' : f.verdict === 'organic' ? 'Organic' : 'Watching';
  $('vText').textContent = hit
    ? f.explanation.summary
    : `${n} accounts, ${f.sprt_trace.length} posts — below decision threshold.`;
  $('groups').innerHTML = FINDINGS.map((g, k) =>
    `<button type="button" aria-pressed="${k === i}" data-g="${k}">${g.accounts.length} accounts (${g.verdict})</button>`).join('');
  $('lgSpike').textContent = hit
    ? `${pairs} pairs within 90s, near-identical wording`
    : `${pairs} pairs scattered in background`;
  $('lgCarpet').textContent = `${sum(carpetGrid)} organic pairs across 10m`;

  $('evSay').innerHTML = hit
    ? `<h3>Claim</h3><blockquote>“${esc(f.explanation.quote)}”</blockquote><p>${esc(f.explanation.technique)}, ${Math.round(f.explanation.confidence * 100)}% confidence</p>`
    : `<h3>Claim</h3><p>No shared claim across posts.</p>`;
  $('evDecision').innerHTML = `<h3>Sequential test</h3>${trace(f)}<p>${hit
    ? `Crossed upper threshold at post ${f.decided_at_item + 1}.`
    : `Between thresholds after ${f.sprt_trace.length} posts.`}</p>`;
  const mx = Math.max(A.snr_db, B.snr_db);
  $('evSignal').innerHTML = `<h3>Signal-to-noise</h3><div class="bars">
      <div><span>Pairwise</span><i style="width:${f.snr_db_single / mx * 100}%"></i><span>${f.snr_db_single} dB</span></div>
      <div><span>Group (${n})</span><i style="width:${f.snr_db / mx * 100}%"></i><span>${f.snr_db} dB</span></div></div>`;
  $('evWho').innerHTML = `<h3>Accounts</h3><ul class="who">${f.accounts.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
    <p>${f.item_ids.length} posts, ${hm(f.first_seen)}–${hm(f.last_seen)} UTC${f.synthetic ? ' (synthetic demo)' : ''}</p>`;
}
function trace(f) {
  const w = 480, h = 156, pl = 6, pr = 96, lo = f.sprt_lower - .6, hi = f.sprt_upper + .9, t = f.sprt_trace;
  const x = k => pl + k / Math.max(1, t.length - 1) * (w - pl - pr), y = v => h - (v - lo) / (hi - lo) * h;
  const pts = t.map((v, k) => `${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' '), hit = f.verdict === 'coordinated';
  const rule = (v, label) => `<line x1="0" x2="${w - pr + 8}" y1="${y(v)}" y2="${y(v)}" stroke="${PAL.cool}" stroke-opacity=".32" stroke-dasharray="3 5"/>
    <text x="${w - pr + 14}" y="${y(v) + 4}" fill="${PAL.muted}" font-size="12">${label}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Evidence over time, post by post">
    ${rule(f.sprt_upper, 'coordinated')}${rule(f.sprt_lower, 'organic')}
    <polyline points="${pts}" fill="none" stroke="${hit ? PAL.warm : PAL.cool}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(t.length - 1)}" cy="${y(t.at(-1))}" r="4.5" fill="${hit ? PAL.peak : PAL.cool}"/></svg>`;
}
function select(i, instant) {
  if (i === sel) return; sel = i; hideTip();
  selTl?.kill();
  const d = reduced || instant ? 0 : 1;
  gsap.to(U.uSel, {value: i, duration: .8 * d, ease: 'power2.inOut', overwrite: true});
  selTl = gsap.timeline().to('#vTitle,#vText', {autoAlpha: 0, duration: .14 * d})
    .call(render, [i]).to('#vTitle,#vText', {autoAlpha: 1, duration: .26 * d});
  setLegend(null); camTo('over', 1.3 * d);
}
function setLegend(btn) {
  document.querySelectorAll('#legend .lg-btn').forEach(b => b.setAttribute('aria-pressed', b === btn));
}
function syncClear() {
  $('clear').classList.toggle('visible', $('q').value.length > 0);
}

/* ------------------------------------------------------------------ wiring */
$('q').addEventListener('input', syncClear);
$('search').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (q && ok) run(q);
});
document.querySelectorAll('[data-sample]').forEach(btn => {
  btn.addEventListener('click', () => { if (ok) run(btn.dataset.sample); });
});
$('clear').addEventListener('click', () => {
  if (root.dataset.stage === 'home') { $('q').value = ''; syncClear(); $('q').focus(); }
  else goHome();
});
$('brandBtn').addEventListener('click', () => { if (root.dataset.stage !== 'home') goHome(); });
$('resetCam').addEventListener('click', () => { setLegend(null); camTo('over', 1.0); });
addEventListener('keydown', e => { if (e.key === 'Escape' && root.dataset.stage !== 'home') goHome(); });
$('groups').addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(+b.dataset.g); });
$('legend').addEventListener('click', e => {
  const b = e.target.closest('.lg-btn'); if (!b) return;
  const on = b.getAttribute('aria-pressed') === 'true';
  setLegend(on ? null : b); camTo(on ? 'over' : b.dataset.cam);
});

try { buildScene(); } catch (err) { ok = false; console.error(err); $('q').placeholder = 'WebGL unavailable'; }
if (ok) {
  new ResizeObserver(resize).observe(stage); resize(); requestAnimationFrame(frame);
  const qs = new URLSearchParams(location.search);       // ?q=topic&skip=1&g=1 opens a state directly
  if (qs.get('q')) { run(qs.get('q'), qs.has('skip')); if (qs.get('g') === '1') select(1, qs.has('skip')); if (qs.get('cam')) camTo(qs.get('cam'), 0); if (qs.get('t')) { tl.pause(); tl.time(+qs.get('t'), false); }
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView(); }
}
</script>
</body>
</html>
