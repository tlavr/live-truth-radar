# Run from the repo root:  docker compose -f infra/docker-compose.yml up -d --build
# Relative paths below resolve from infra/. Secrets come from ../.env (git-ignored, optional locally).

x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  image: ltr-app
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-ltr}:${POSTGRES_PASSWORD:-ltr}@db:5432/${POSTGRES_DB:-ltr}
  volumes:
    - ../eval:/app/eval:ro
    - ../cache:/app/cache
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ltr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ltr}
      POSTGRES_DB: ${POSTGRES_DB:-ltr}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # applied once, when the pgdata volume is first created
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    <<: *app
    command: ["python", "-m", "ingest.worker"]

  caddy:
    image: caddy:2-alpine
    environment:
      # unset/empty locally -> ":80" (plain HTTP); DOMAIN=example.com in .env on the VPS -> automatic HTTPS
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
